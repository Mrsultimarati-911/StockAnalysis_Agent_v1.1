name: Offline tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: agent_project/requirements.lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r agent_project/requirements.lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run offline tests
        run: python -X utf8 -m unittest discover -s agent_project/tests -v
